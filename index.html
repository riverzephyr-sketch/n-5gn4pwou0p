<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe9df">
<meta name="robots" content="noindex,nofollow">
<title>1461 DAYS WITH YOU</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%237a1f24%22/%3E%3Ctext x=%2250%22 y=%2266%22 font-size=%2248%22 text-anchor=%22middle%22 fill=%22%23efe9df%22 font-family=%22serif%22%3E4%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/NotoSerifSC.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/BodoniModa.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/BodoniModa-Italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="vendor/gsap.min.js?v=10220647" as="script">
<link rel="stylesheet" href="style.css?v=10220647">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<!-- 1. HERO -->
<header class="hero paper" id="hero">
  <span class="corner bl">2022.10.30</span><span class="corner br">2026.10.30</span>
  <div class="hang">
    <div class="ribbon"></div>
    <figure class="behind b1" id="behind1"></figure>
    <figure class="behind b2" id="behind2"></figure>
    <div class="tag" id="tag">
      <i class="grommet"></i>
      <div class="tag-top"><span>No. 1461</span></div>
      <h1 class="lk lk-hero" data-lk="hero"><span class="num">1461</span></h1>
      <div class="tag-count"><span class="t-days" id="cDays">0</span><span class="t-unit">天</span>
        <span class="t-time"><span id="cH">00</span><em>:</em><span id="cM">00</span><em>:</em><span id="cS">00</span></span></div>
      <div class="t-bar"><i id="bar"></i></div>
      <div class="tag-foot"><span>since 2022.10.30</span></div>
    </div>
  </div>
  <p class="hero-sub" id="heroSub"></p>
  <div class="record-spot">
    <div class="vinyl" id="vinyl" role="button" tabindex="0" aria-label="播放 / 暂停">
      <div class="v-label"><span class="v-t">Side A</span><span class="v-s" id="vTitle" translate="no"></span><span class="v-b">1461</span></div>
    </div>
    <div class="tonearm" id="tonearm"><i class="pivot"></i><i class="arm"></i><i class="head"></i></div>
    <button class="play-tag" id="playTag"><i class="grommet sm"></i><span class="tri"></span><span id="playTagText"></span></button>
  </div>
  <a class="cue" href="#jianghu" aria-label="往下"><i></i></a>
</header>

<!-- 1.5 JIANGHU -->
<section class="sec paper jianghu" id="jianghu">
  <canvas class="snow" id="snow" aria-hidden="true"></canvas>
  <span class="corner tl" id="jhTL"></span>
  <div class="chat" id="chat"></div>
  <p class="jh-quiet" id="jhQuiet"></p><p class="jh-song" id="jhSong" translate="no"></p>
  <div class="lk lk-jianghu" data-lk="jianghu"></div>
  <svg class="jh-route" viewBox="0 0 300 60" aria-hidden="true"><path class="hair" d="M276 12 C 236 8, 214 34, 178 30 S 120 22, 92 40 S 44 52, 24 48"/><circle cx="276" cy="12" r="2.4"/><circle cx="24" cy="48" r="2.4"/><text x="282" y="15" id="jhFrom"></text><text x="18" y="51" text-anchor="end" id="jhTo"></text></svg>
</section>

<!-- 2. HOTEL -->
<section class="sec paper hotel" id="hotel">
  <span class="corner tl" id="hLabel"></span>
  <div class="lk lk-hotel" data-lk="hotel"></div>
  <svg class="taxi-line" viewBox="0 0 340 90" aria-hidden="true">
    <path class="hair" d="M20 70 C 60 70, 70 20, 120 22 C 170 24, 180 78, 230 62 C 268 50, 262 16, 300 20 C 330 24, 330 60, 300 64 C 270 68, 200 90, 120 80 C 80 76, 50 74, 24 71"/>
    <circle cx="20" cy="70" r="3"/><circle cx="300" cy="20" r="3" class="o"/>
    <text x="20" y="88">Marriott</text><text x="300" y="10" text-anchor="middle">JW Marriott</text>
  </svg>
  <div class="score" aria-live="polite"><span class="score-lab" id="scoreLab"></span><span class="score-hist" id="scoreHist"></span><span class="score-now"><b id="score">100</b></span></div>
  <div class="hotels" id="hotels"></div>
  <blockquote class="then" id="then" aria-live="polite"></blockquote>
</section>

<!-- 3. CHAPTERS (film) -->
<section class="sec film chapters" id="chapters">
  <div class="lk lk-chapters" data-lk="chapters"></div>
  <div class="roll-intro">
    <div class="canister" id="canister"><i class="ccap top"></i><div class="can-body"><span class="can-small" id="can1"></span><span class="can-big" id="can2"></span></div><i class="ccap bot"></i></div>
    <div class="strip-h" id="stripH"></div>
  </div>
  <div id="chapterList"></div>
</section>

<!-- 4. MAP -->
<section class="sec crumple map-sec" id="map">
  <div class="lk lk-map" data-lk="map"></div>
  <div class="stats" id="stats"></div>
  <div class="zoom" id="zoom">
    <button data-z="all" class="on">全图</button>
    <button data-z="yrd">长三角</button>
    <button data-z="prd">珠三角</button>
    <button data-z="ne">日韩</button>
  </div>
  <div class="map-sheet"><i class="tape t1"></i><i class="tape t2"></i><svg id="mapSvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="chips" id="chips"></div>
</section>

<!-- 6. FINALE -->
<section class="sec film finale" id="finale">
  <span class="pcn tl" id="fTL"></span><span class="pcn tr" id="fTR"></span>
  <i class="f-star" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 2 L21.4 18.6 L38 20 L21.4 21.4 L20 38 L18.6 21.4 L2 20 L18.6 18.6 Z"/></svg></i>
  <div class="lk lk-finale" data-lk="finale"></div>
  <div class="envelope" id="envelope">
    <div class="env-back"></div>
    <div class="env-letter" aria-hidden="true"><span></span></div>
    <div class="env-flap"></div>
    <div class="env-front">
      <span class="env-to" id="envTo"></span>
      <span class="env-label" id="lcTitle"></span>
    </div>
    <div class="seal" id="seal"></div>
  </div>
  <p class="lc-hint" id="lcHint"></p>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>

  <button class="heart" id="heart" aria-label="点一下"><svg viewBox="0 0 40 36"><path d="M20 33 C 9 25 2 18.5 2 11 C 2 5.5 6.2 2 10.8 2 C 14.6 2 17.8 4.4 20 8.2 C 22.2 4.4 25.4 2 29.2 2 C 33.8 2 38 5.5 38 11 C 38 18.5 31 25 20 33 Z"/></svg></button>
  <p class="heart-line" id="heartLine"></p>
</section>

<!-- Floating mini player -->
<button class="mini" id="mini" aria-label="音乐"><span class="mini-disc"></span><span class="mini-txt" id="miniTxt" translate="no"></span></button>
<audio id="song" preload="none" loop playsinline></audio>

<!-- City card -->
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-bg" data-close></div>
  <article class="pola-card" role="dialog" aria-modal="true">
    <i class="tape top"></i>
    <button class="x" data-close aria-label="关闭"><i></i></button>
    <p class="s-idx" id="sIdx"></p>
    <div class="ph" id="sPhoto"></div>
    <div class="pc-cap">
      <h3 class="s-name"><span id="sName"></span><span class="s-en" id="sEn"></span></h3>
      <p class="s-mem" id="sMem"></p>
    </div>
    <div class="s-nav"><button id="sPrev">‹ 上一站</button><button id="sNext">下一站 ›</button></div>
  </article>
</div>

<!-- Hidden page -->
<div class="secret paper" id="secret" aria-hidden="true">
  <div class="develop" aria-hidden="true"></div>
  <div class="secret-in">
    <button class="x" id="secretClose" aria-label="关闭"><i></i></button>
    <span class="corner tl">2026.10.31</span>
    <div class="lk lk-secret" data-lk="secret"></div>
    <figure class="silhouette" id="silhouette"></figure>
    <div class="pair" id="pair"></div>
    <article class="letter-card"><i class="tape top"></i>
      <h3 class="letter-title" id="letterTitle"></h3>
      <div class="letter" id="letter"></div>
      <p class="sig" id="sig"></p>
    </article>
    <figure class="pola small" id="secPola"></figure>
    <div class="rings" id="rings"></div>
    <div class="lyrics" id="lyrics"></div>
    <div class="lk lk-polaris" data-lk="polaris"></div>
    <figure class="pola undeveloped" id="weddingPola"></figure>
  </div>
</div>

<script src="content.js?v=10220647"></script>
<script src="map-data.js?v=10220647"></script>
<script src="photos/sizes.js?v=10220647"></script>
<script src="app.js?v=10220647"></script>
</body>
</html>
