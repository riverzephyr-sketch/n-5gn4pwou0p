<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d0910">
<meta name="robots" content="noindex,nofollow">
<title>1461 DAYS WITH YOU</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%235a0f17%22/%3E%3Ctext x=%2250%22 y=%2266%22 font-size=%2248%22 text-anchor=%22middle%22 fill=%22%23efe9df%22 font-family=%22serif%22%3E4%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/BodoniModa.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="photos/sunset-sit.webp" as="image" fetchpriority="high">
<link rel="preload" href="assets/tag-short.webp" as="image">
<script>(function(d){try{
  /* loader (first visit of a session only): the homepage print develops on the paper, then settles into the hero */
  if(location.hash||sessionStorage.getItem("ld1461"))return; sessionStorage.setItem("ld1461","1");
  d.classList.add("ld","ld-show"); if(history.scrollRestoration)history.scrollRestoration="manual";
  window.LOADER=new Promise(function(r){window.__ldDone=r});
  window.__ldKill=setTimeout(function(){d.classList.remove("ld","ld-show");window.__ldDone()},7000); // safety net if app.js never runs
}catch(e){}})(document.documentElement)</script>
<script>(function(d){if(!window.matchMedia||matchMedia("(prefers-reduced-motion: reduce)").matches)return;d.classList.add("motion-pending","tag-wait");setTimeout(function(){d.classList.remove("motion-pending")},2500);setTimeout(function(){d.classList.add("tag-fade");d.classList.remove("tag-wait")},8000)})(document.documentElement)</script>
<link rel="stylesheet" href="style.css?v=70">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div id="ld" role="status" aria-label="1461 DAYS WITH YOU"></div>

<!-- 1 · HERO — a cotton tag on a wine ribbon, one print tucked behind -->
<header class="hero wine" id="hero">
  <span class="meta tl" id="heroVol"></span>
  <div class="hang">
    <figure class="print hero-print" id="heroPrint"></figure>
    <div class="tag obj" id="tag">
      <img src="assets/tag-short.webp" width="660" height="1363" alt="" fetchpriority="high">
      <i class="light" aria-hidden="true"></i>
      <div class="tag-face">
        <h1 class="hero-num" aria-label="1461 Days with you"><span class="d" aria-hidden="true">1</span><span class="d" aria-hidden="true">4</span><span class="d" aria-hidden="true">6</span><span class="d" aria-hidden="true">1</span></h1>
        <p class="hero-dates"><i class="script">Days with you</i><b class="rule"></b><span>2022.10.30 — 2026.10.30</span></p>
        <p class="tag-count"><span class="t-days" id="cDays">0</span><span class="t-unit">天</span><span class="t-time"><span id="cH">00</span>:<span id="cM">00</span>:<span id="cS">00</span></span></p>
      </div>
    </div>
  </div>
  <p class="hero-sub" id="heroSub"></p>
  <div class="scue" id="scue" aria-hidden="true"><span class="scue-t">Scroll</span><i class="scue-l"><b></b></i></div>
</header>

<!-- 2 · 江湖 — one printed post: the song he shared, the line she left -->
<section class="sec paper jianghu" id="jianghu">
  <canvas class="snow" id="snow" aria-hidden="true"></canvas>
  <p class="sr-only" id="jhSr"></p>
  <p class="prov" aria-hidden="true"><span id="jhGame"></span> · <span id="jhGuild"></span><small><span id="jhMe"></span> / <span id="jhHim"></span></small></p>
  <div class="slip-wrap">
  <ul class="aimer" id="aimer" aria-hidden="true"></ul>
  <article class="slip obj" id="slip" aria-hidden="true">
    <img class="slip-paper" src="assets/slip.webp" width="900" height="1096" alt="" loading="lazy" decoding="async">
    <i class="light"></i>
    <img class="tape-img" src="assets/tape.webp" width="360" height="90" alt="" loading="lazy">
    <div class="post">
      <p class="who" id="jhWho" translate="no"></p>
      <div class="cover" id="jhCover"><img src="assets/refrain-cover.webp" width="720" height="720" alt="" loading="lazy" decoding="async"></div>
      <p class="song"><b class="t" id="jhTitle" translate="no"></b><span class="a" id="jhArtist" translate="no"></span></p>
      <i class="perf"></i>
      <p class="cmt"><span class="n" id="jhMeW" translate="no"></span><span class="k">：</span><span class="q" id="jhQuiet"></span></p>
    </div>
  </article>
  <img class="heart-sticker" src="assets/heart.webp" width="240" height="230" alt="" aria-hidden="true" loading="lazy" decoding="async">
  </div>
  <div class="lk lk-jianghu" data-lk="jianghu"></div>
</section>

<!-- 3 · 重庆 · 初见 — 北京 → 重庆, the Marriott incident -->
<section class="sec paper hotel" id="hotel">
  <p class="itin" aria-label="北京 — 重庆"><span><b id="jhFrom"></b><small id="jhFromEn"></small></span><i></i><span><b id="jhTo"></b><small id="jhToEn"></small></span></p>
  <span class="meta lbl" id="hLabel"></span>
  <div class="lk lk-hotel" data-lk="hotel"></div>
  <div class="score" aria-live="polite"><span class="score-lab" id="scoreLab"></span><span class="score-hist" id="scoreHist"></span><span class="score-now"><b id="score">100</b></span></div>
  <div class="hotels" id="hotels"></div>
  <blockquote class="then" id="then" aria-live="polite"></blockquote>
</section>

<!-- 4 · four rolls -->
<section class="sec night chapters" id="chapters">
  <div class="lk lk-chapters" data-lk="chapters"></div>
  <div class="roll-intro">
    <div class="canister" id="canister"><i class="ccap top"></i><div class="can-body"><span class="can-small" id="can1"></span><b class="can-big" id="can2"></b></div><i class="ccap bot"></i></div>
    <div class="strip-win"><nav class="strip-h" id="stripH" aria-label="Rolls"></nav></div>
  </div>
  <div id="chapterList"></div>
</section>

<!-- 5 · map -->
<section class="sec paper map-sec" id="map">
  <div class="lk lk-map" data-lk="map"></div>
  <div class="map-sheet"><img class="tape-img t1" src="assets/tape.webp" width="360" height="90" alt="" loading="lazy" decoding="async"><img class="tape-img t2" src="assets/tape.webp" width="360" height="90" alt="" loading="lazy" decoding="async"><svg id="mapSvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="zoom" id="zoom">
    <button data-z="all" class="on">全图</button>
    <button data-z="yrd">长三角</button>
    <button data-z="prd">珠三角</button>
    <button data-z="ne">日韩</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="chips" id="chips"></div>
  <div class="story" id="story"></div>
</section>

<!-- 5½ · the date — a strip of three days, the 30th circled once by hand -->
<section class="sec paper cal" id="calendar">
  <p class="cal-kick"><span class="kick">October</span><i class="script" id="calScript"></i></p>
  <div class="cal-beat">
    <div class="cal-strip" id="calStrip" aria-label="2026.10.30">
      <div class="cal-cell"><span class="wd"><span class="wt">Thursday</span></span><b>29</b><span class="mo">Oct</span></div>
      <div class="cal-cell on"><span class="wd"><span class="wt">Friday</span></span><b>30</b><span class="mo">Oct</span><span class="since" id="calSince"></span>
        <i class="mark cal-ring" aria-hidden="true"><svg viewBox="-4 -4 238 218" preserveAspectRatio="none"><path pathLength="1" d="M56.0 30.3 C57.6 29.4 62.3 26.6 65.7 25.0 C69.0 23.5 72.4 22.0 76.0 20.8 C79.5 19.6 83.2 18.6 86.9 17.7 C90.6 16.9 94.4 16.2 98.2 15.8 C102.0 15.3 105.9 15.1 109.8 15.0 C113.6 14.9 117.5 15.1 121.4 15.4 C125.3 15.7 129.2 16.3 133.0 17.0 C136.8 17.7 140.6 18.6 144.3 19.7 C148.0 20.8 151.6 22.1 155.1 23.6 C158.6 25.0 162.1 26.7 165.4 28.5 C168.7 30.3 171.9 32.2 174.9 34.3 C177.9 36.4 180.8 38.7 183.5 41.1 C186.1 43.5 188.7 46.0 191.0 48.6 C193.3 51.2 195.5 54.0 197.4 56.8 C199.3 59.7 201.0 62.6 202.5 65.6 C204.0 68.6 205.3 71.7 206.4 74.8 C207.4 78.0 208.3 81.1 208.9 84.4 C209.5 87.6 209.9 90.8 210.0 94.1 C210.1 97.3 210.0 100.6 209.7 103.8 C209.4 107.1 208.9 110.3 208.1 113.5 C207.4 116.7 206.4 119.9 205.2 123.0 C204.0 126.1 202.6 129.2 201.0 132.2 C199.4 135.2 197.5 138.1 195.6 140.9 C193.6 143.7 191.4 146.5 189.1 149.1 C186.7 151.7 184.2 154.2 181.5 156.6 C178.9 159.0 176.1 161.2 173.1 163.3 C170.2 165.4 167.1 167.4 163.9 169.2 C160.7 171.1 157.4 172.7 154.0 174.2 C150.7 175.8 147.2 177.1 143.6 178.3 C140.1 179.4 136.5 180.5 132.8 181.3 C129.2 182.1 125.5 182.8 121.8 183.2 C118.0 183.7 114.3 184.0 110.5 184.1 C106.8 184.2 103.0 184.1 99.3 183.8 C95.6 183.6 91.9 183.1 88.3 182.5 C84.6 181.8 81.0 181.0 77.5 180.0 C74.0 179.0 70.5 177.9 67.2 176.5 C63.8 175.2 60.5 173.7 57.4 172.0 C54.2 170.4 51.2 168.5 48.3 166.6 C45.4 164.6 42.6 162.5 40.0 160.2 C37.4 158.0 34.9 155.6 32.7 153.1 C30.4 150.6 28.3 147.9 26.4 145.2 C24.5 142.5 22.8 139.6 21.3 136.7 C19.8 133.8 18.5 130.8 17.5 127.7 C16.4 124.7 15.6 121.6 14.9 118.4 C14.3 115.3 13.9 112.0 13.8 108.8 C13.7 105.6 13.7 102.4 14.1 99.1 C14.4 95.9 15.0 92.7 15.8 89.5 C16.6 86.3 17.6 83.1 18.9 80.0 C20.2 76.9 21.7 73.8 23.4 70.8 C25.1 67.9 27.1 64.9 29.2 62.1 C31.4 59.3 33.8 56.6 36.3 54.0 C38.9 51.4 41.6 48.9 44.5 46.5 C47.5 44.2 50.6 42.0 53.8 39.9 C57.0 37.8 60.4 35.9 63.9 34.2 C67.4 32.4 71.1 30.8 74.8 29.4 C78.5 28.0 82.4 26.8 86.3 25.8 C90.1 24.7 94.1 23.9 98.1 23.2 C102.1 22.6 106.1 22.1 110.2 21.8 C114.2 21.6 118.3 21.5 122.3 21.6 C126.3 21.7 132.3 22.4 134.3 22.5"/></svg></i></div>
      <div class="cal-cell"><span class="wd"><span class="wt">Saturday</span></span><b>31</b><span class="mo">Oct</span></div>
    </div>
    <figure class="print cal-print" id="calPrint"></figure>
  </div>
  <p class="cal-line" id="calLine"></p>
</section>

<!-- 6 · ending: the years, the envelope, the passcode -->
<section class="sec wine finale" id="finale">
  <span class="paren-c tl" id="fTL"></span><span class="paren-c tr" id="fTR"></span>
  <div class="fin-title"><div class="years" id="years" aria-hidden="true"></div><div class="lk lk-finale" data-lk="finale"></div></div>
  <div class="desk">
    <figure class="stamps obj" aria-hidden="true"><img src="assets/stamps.webp" width="620" height="728" alt="" loading="lazy" decoding="async"><img class="clip" src="assets/clip.webp" width="120" height="225" alt="" loading="lazy"></figure>
    <div class="envelope obj" id="envelope">
      <div class="env-letter" aria-hidden="true"></div>
      <img class="env-open" src="assets/envelope-open.webp" width="840" height="583" alt="" loading="lazy" decoding="async">
      <img class="env-shut" src="assets/envelope.webp" width="840" height="583" alt="" loading="lazy" decoding="async">
      <i class="light" aria-hidden="true"></i>
      <div class="seal" id="seal" aria-hidden="true"></div>
      <span class="env-to" id="envTo"></span><span class="env-label" id="lcTitle"></span>
    </div>
    <p class="closing" id="closing"></p>
  </div>
  <div class="lock">
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad" role="group" aria-label="密码"></div>
    <button class="heart" id="heart" aria-label="点一下"><svg viewBox="0 0 40 36"><path d="M20 33 C 9 25 2 18.5 2 11 C 2 5.5 6.2 2 10.8 2 C 14.6 2 17.8 4.4 20 8.2 C 22.2 4.4 25.4 2 29.2 2 C 33.8 2 38 5.5 38 11 C 38 18.5 31 25 20 33 Z"/></svg></button>
    <p class="heart-line" id="heartLine"></p>
  </div>
</section>

<!-- the music, folded small (bottom-right, inside the safe area) -->
<button class="mini fresh" id="mini" type="button" aria-label="播放 / 暂停音乐"><span class="mini-txt" id="miniTxt" translate="no"></span><span class="mini-dot" aria-hidden="true"><i></i></span></button>
<audio id="song" preload="none" loop playsinline></audio>

<!-- City card -->
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-bg" data-close></div>
  <article class="pola-card" role="dialog" aria-modal="true">
    <img class="tape-img top" src="assets/tape.webp" width="360" height="90" alt="" loading="lazy" decoding="async">
    <button class="x" data-close aria-label="关闭"><i></i></button>
    <p class="s-idx" id="sIdx"></p>
    <div class="ph" id="sPhoto"></div>
    <div class="pc-cap">
      <h3 class="s-name"><span id="sName"></span><span class="s-en" id="sEn"></span></h3>
      <p class="s-mem" id="sMem"></p>
    </div>
    <div class="s-nav"><button id="sPrev">上一站</button><button id="sNext">下一站</button></div>
  </article>
</div>

<!-- Hidden page -->
<div class="secret paper" id="secret" aria-hidden="true" tabindex="-1" role="dialog" aria-modal="true" aria-label="Next Chapter">
  <div class="secret-in">
    <button class="x" id="secretClose" aria-label="关闭"><i></i></button>
    <span class="meta tl">2026.10.31</span>
    <div class="lk lk-secret" data-lk="secret"></div>
    <div class="sx-archive">
      <div class="book" id="cover">
        <h3 class="book-t" id="coverT"></h3>
        <p class="book-a" id="coverA"></p>
        <figure class="silhouette" id="silhouette"></figure>
        <p class="book-q" id="coverQ"></p>
        <p class="book-by" id="coverBy"></p>
        <p class="book-i" id="coverI"></p>
      </div>
      <div class="pair" id="pair"></div>
    </div>
    <div class="sx-polaris">
      <div class="reel-notes" id="reelNotes"></div>
      <div class="vm-disc-wrap" id="record"></div>
      <div class="lyrics" id="lyrics"></div>
      <figure class="pola undeveloped" id="weddingPola"></figure>
    </div>
    <article class="letter-card letter-end">
      <h3 class="letter-title" id="letterTitle"></h3>
      <div class="letter" id="letter"></div>
      <p class="sig" id="sig"></p>
    </article>
  </div>
</div>

<script src="content.js?v=70"></script>
<script src="map-data.js?v=70"></script>
<script src="photos/sizes.js?v=70"></script>
<script src="app.js?v=70"></script>
</body>
</html>
